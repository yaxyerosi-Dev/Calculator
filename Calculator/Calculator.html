<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="./image.png">
    <title>Calculator</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-900 flex items-center justify-center min-h-screen">

    <div class="bg-gray-800 p-6 rounded-2xl shadow-2xl w-80">

        <!-- Display -->
        <input type="text" id="display"
            class="w-full h-16 mb-4 text-right text-3xl px-4 rounded-lg bg-gray-700 text-white outline-none" readonly>

        <!-- Buttons -->
        <div class="grid grid-cols-4 gap-3">

            <!-- Row 1 -->
            <button onclick="clearDisplay()" class="bg-red-500 text-white p-4 rounded-lg text-xl hover:bg-red-400">
                C
            </button>

            <button onclick="appendValue('/')"
                class="bg-orange-500 text-white p-4 rounded-lg text-xl hover:bg-orange-400">
                /
            </button>

            <button onclick="appendValue('*')"
                class="bg-orange-500 text-white p-4 rounded-lg text-xl hover:bg-orange-400">
                *
            </button>

            <button onclick="deleteLast()" class="bg-yellow-500 text-white p-4 rounded-lg text-xl hover:bg-yellow-400">
                ⌫
            </button>

            <!-- Row 2 -->
            <button onclick="appendValue('7')" class="bg-gray-600 text-white p-4 rounded-lg text-xl hover:bg-gray-500">
                7
            </button>

            <button onclick="appendValue('8')" class="bg-gray-600 text-white p-4 rounded-lg text-xl hover:bg-gray-500">
                8
            </button>

            <button onclick="appendValue('9')" class="bg-gray-600 text-white p-4 rounded-lg text-xl hover:bg-gray-500">
                9
            </button>

            <button onclick="appendValue('-')"
                class="bg-orange-500 text-white p-4 rounded-lg text-xl hover:bg-orange-400">
                -
            </button>

            <!-- Row 3 -->
            <button onclick="appendValue('4')" class="bg-gray-600 text-white p-4 rounded-lg text-xl hover:bg-gray-500">
                4
            </button>

            <button onclick="appendValue('5')" class="bg-gray-600 text-white p-4 rounded-lg text-xl hover:bg-gray-500">
                5
            </button>

            <button onclick="appendValue('6')" class="bg-gray-600 text-white p-4 rounded-lg text-xl hover:bg-gray-500">
                6
            </button>

            <button onclick="appendValue('+')"
                class="bg-orange-500 text-white p-4 rounded-lg text-xl hover:bg-orange-400">
                +
            </button>

            <!-- Row 4 -->
            <button onclick="appendValue('1')" class="bg-gray-600 text-white p-4 rounded-lg text-xl hover:bg-gray-500">
                1
            </button>

            <button onclick="appendValue('2')" class="bg-gray-600 text-white p-4 rounded-lg text-xl hover:bg-gray-500">
                2
            </button>

            <button onclick="appendValue('3')" class="bg-gray-600 text-white p-4 rounded-lg text-xl hover:bg-gray-500">
                3
            </button>

            <button onclick="calculate()"
                class="bg-green-500 text-white p-4 rounded-lg text-xl row-span-2 hover:bg-green-400">
                =
            </button>

            <!-- Row 5 -->
            <button onclick="appendValue('0')"
                class="bg-gray-600 text-white p-4 rounded-lg text-xl hover:bg-gray-500 col-span-2">
                0
            </button>

            <button onclick="appendValue('.')" class="bg-gray-600 text-white p-4 rounded-lg text-xl hover:bg-gray-500">
                .
            </button>

        </div>
    </div>

    <script src="./calculator.js"></script>

</body>

</html>
